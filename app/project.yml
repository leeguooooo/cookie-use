name: CookieUse
options:
  bundleIdPrefix: com.cookieuse
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
targets:
  CookieUse:
    type: application
    platform: macOS
    sources:
      - path: CookieUse/App
      - path: CookieUse/Core
      - path: CookieUse/UI
    info:
      path: CookieUse/App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: CookieUse
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: "CookieUse reads the address of Chrome's front tab so you can save that site's login in one click."
        CFBundleDocumentTypes:
          - CFBundleTypeName: cookie-use session bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cookieuse.session]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cookieuse.session
            UTTypeDescription: cookie-use session bundle
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cusession]
    entitlements:
      path: CookieUse/App/CookieUse.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookieuse.app
        PRODUCT_NAME: CookieUse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock and inject account sessions."
