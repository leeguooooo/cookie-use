name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build binaries for, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: cookie-use-darwin-arm64
          - target: x86_64-apple-darwin
            asset: cookie-use-darwin-x64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "${{ matrix.asset }}.tar.gz" cookie-use
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/${{ matrix.asset }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.asset }}.tar.gz.sha256

  # Developer ID signed + notarized + stapled (app and dmg), so it opens on a
  # double-click with no Gatekeeper warning. Same secrets as ChooseBrowser's
  # direct release; the identity lives in a throwaway keychain.
  dmg:
    name: Build, sign, notarize and publish CookieUse.dmg
    # The app targets macOS 26 and the project is Xcode format 77: macos-14's
    # Xcode 15 can open neither (the v0.4.0 dmg build failed exactly there).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # CFBundleVersion = commit count, must keep growing

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID certificate and API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_KEY_P8_BASE64 MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD; do
            [ -n "${!v:-}" ] || { echo "::error::missing secret $v"; exit 1; }
          done
          cert="$RUNNER_TEMP/devid.p12"; kc="$RUNNER_TEMP/signing.keychain-db"; key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          kcpw="$(openssl rand -hex 16)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$cert" "$key"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security -k "$kc"
          security list-keychains -d user -s "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          rm -f "$cert"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize app + dmg
        env:
          SIGNING_IDENTITY: Developer ID Application
          # The in-place updater checks the downloaded app's version against the tag.
          APP_VERSION: ${{ (github.event.inputs.tag || github.ref_name) }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APP_VERSION="${APP_VERSION#v}"
          export APP_BUILD="$(git rev-list --count HEAD)"
          bash app/build-dmg.sh
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/build/CookieUse.app/Contents/Info.plist)"
          [ "$v" = "$APP_VERSION" ] || { echo "::error::app version $v != tag $APP_VERSION"; exit 1; }

      - name: Verify the dmg actually mounts and contains the app
        # 发一个装不上的资产比不发更糟：用户会照着 README 一路走到 hdiutil 才失败。
        run: |
          set -euo pipefail
          mnt="$(hdiutil attach -nobrowse -noautoopen app/build/CookieUse.dmg | grep -o '/Volumes/.*' | head -1)"
          test -d "$mnt/CookieUse.app" || { echo "dmg 里没有 CookieUse.app"; exit 1; }
          hdiutil detach "$mnt" -quiet

      - name: Checksum
        run: cd app/build && shasum -a 256 CookieUse.dmg > CookieUse.dmg.sha256

      # Downloaded by the app's in-place updater (CookieUse/Core/AppUpdater.swift),
      # which verifies checksum, Developer ID, notarization, version and architecture.
      - name: Package in-place update archive
        run: |
          set -euo pipefail
          xcrun stapler validate app/build/CookieUse.app
          tar -czf app/build/CookieUse-macos.tar.gz -C app/build CookieUse.app
          cd app/build && shasum -a 256 CookieUse-macos.tar.gz > CookieUse-macos.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            app/build/CookieUse.dmg
            app/build/CookieUse.dmg.sha256
            app/build/CookieUse-macos.tar.gz
            app/build/CookieUse-macos.tar.gz.sha256
